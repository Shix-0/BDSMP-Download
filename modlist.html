<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista plików</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <header class="topbar wrap">
    <a class="brand" href="#top" aria-label="ShiroNeko home">
      <img src="assets/shironoko-icon.png" alt="" width="42" height="42">
      <span>Shiro<span class="brand-light">Neko</span></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="index.html">Features</a>
      <a href="index.html">Getting started</a>
      <a class="nav-cta" href="#download">Download <span aria-hidden="true">↗</span></a>
    </nav>
  </header>


<table>
    <tbody id="tabela"></tbody>
</table>

<script>
fetch('lista-plikow.txt')
  .then(r => r.text())
  .then(tekst => {
    const x = JSON.parse(tekst);
    const tabela = document.getElementById("tabela");
    tabela.innerHTML = "";

    let tr;
    for (let i = 0; i < x.length; i++) {
        if (i % 1 == 0) {              // nowy wiersz co 5 elementów
            tr = document.createElement("tr");
            tabela.appendChild(tr);
        }
        const td = document.createElement("td");
        td.textContent = x[i];
        tr.appendChild(td);
    }

});

</script>

</body>
</html>
