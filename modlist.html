<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista plików</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<table>
    <tbody id="tabela"></tbody>
</table>

<script>
fetch('lista-plikow.txt')
  .then(r => r.text())
  .then(tekst => {
    const x = JSON.parse(tekst);
    const tabela = document.getElementById("tabela");
    tabela.innerHTML = "";

    let tr;
    for (let i = 0; i < x.length; i++) {
        if (i % 3 == 0) {              // nowy wiersz co 5 elementów
            tr = document.createElement("tr");
            tabela.appendChild(tr);
        }
        const td = document.createElement("td");
        td.textContent = x[i];
        tr.appendChild(td);
    }

});

</script>

</body>
</html>
